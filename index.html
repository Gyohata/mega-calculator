<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Mega Calculator — fast, simple calculators for everyday life.">
<title>Mega Calculator — Simple Everyday Calculators</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e6e8ef;position:sticky;top:0;z-index:5}
.wrap{max-width:1100px;margin:auto;padding:0 20px}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-weight:800;font-size:21px;color:#172033}.logo span{color:#4f46e5}
nav a{color:#4b5563;text-decoration:none;margin-left:18px;font-size:14px}
.hero{padding:52px 0 30px;text-align:center}.hero h1{font-size:clamp(34px,6vw,54px);margin:0 0 12px;letter-spacing:-1.8px}.hero p{margin:0 auto;color:#697386;max-width:620px;font-size:17px}
.search{max-width:600px;margin:26px auto 0}.search input{width:100%;padding:15px 18px;border:1px solid #dfe3eb;border-radius:13px;font-size:16px;outline:none;background:#fff}.search input:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f120}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 0 48px}.card{background:#fff;border:1px solid #e6e8ef;border-radius:16px;padding:20px;text-decoration:none;color:inherit;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#cfd3df}.icon{font-size:25px}.card h2{font-size:17px;margin:12px 0 7px}.card p{font-size:13px;color:#727b8d;margin:0;line-height:1.45}
.tool{max-width:680px;margin:36px auto 60px;background:#fff;border:1px solid #e5e7ee;border-radius:20px;padding:28px}.back{font-size:14px;color:#4f46e5;text-decoration:none}.tool h1{margin:14px 0 6px;font-size:32px}.tool>p{color:#697386}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid #dfe3eb;border-radius:10px;font-size:16px}.btn{margin-top:18px;border:0;border-radius:10px;padding:13px 18px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.result{margin-top:18px;padding:18px;background:#f3f4ff;border-radius:12px;font-size:18px;font-weight:700}.muted{font-size:13px;color:#6b7280;font-weight:400;margin-top:7px}.faq{margin-top:28px;border-top:1px solid #eee;padding-top:18px}.faq h2{font-size:18px}.faq p{color:#697386;line-height:1.6}
footer{border-top:1px solid #e6e8ef;background:#fff;padding:30px 0;color:#7a8393;font-size:13px;text-align:center}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){nav a{display:none}.wrap{padding:0 15px}.hero{padding-top:35px}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:16px}.fields{grid-template-columns:1fr}.tool{padding:20px;margin-top:22px}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="logo">Mega<span>Calculator</span></div><nav><a href="#home">Calculators</a><a href="#about">About</a></nav></div></header>
<main id="app"></main>
<footer><div class="wrap">Mega Calculator · Simple calculators for everyday life.</div></footer>
<script>
const tools=[
["percentage-calculator","%","Percentage Calculator","Calculate percentages, increases and decreases."],
["discount-calculator","🏷️","Discount Calculator","Find sale prices and savings instantly."],
["tip-calculator","💵","Tip Calculator","Calculate tips, totals and per-person amounts."],
["age-calculator","🎂","Age Calculator","Find your exact age and next birthday."],
["bmi-calculator","⚖️","BMI Calculator","Calculate BMI using metric or imperial units."],
["date-difference","📅","Date Difference","Find the time between two dates."],
["time-calculator","⏱️","Time Calculator","Calculate the duration between times."],
["vat-calculator","🧾","VAT Calculator","Add or remove VAT from an amount."],
["salary-calculator","💰","Salary Calculator","Estimate take-home pay from gross salary."],
["fraction-calculator","➗","Fraction Calculator","Add, subtract, multiply and divide fractions."],
["random-number-generator","🎲","Random Number","Generate random numbers in a chosen range."],
["unit-converter","📏","Unit Converter","Convert length, weight, temperature and more."]
];
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function home(){
app.innerHTML=`<section class="hero wrap" id="home"><h1>Simple calculators.<br>Instant answers.</h1><p>Fast, free calculators for everyday questions. No signup. No complicated setup.</p><div class="search"><input id="search" placeholder="Search calculators…"></div></section><section class="wrap"><div class="grid" id="grid">${tools.map(t=>`<a class="card" data-name="${t[2].toLowerCase()}" href="#${t[0]}"><div class="icon">${t[1]}</div><h2>${t[2]}</h2><p>${t[3]}</p></a>`).join("")}</div></section>`;
document.getElementById("search").oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll(".card").forEach(c=>c.style.display=c.dataset.name.includes(q)?"":"none")};
}
function input(id,label,type="number",step="any"){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" step="${step}"></div>`}
function page(title,desc,body,calc){
app.innerHTML=`<section class="tool"><a class="back" href="#">← All calculators</a><h1>${title}</h1><p>${desc}</p><div class="fields">${body}</div><button class="btn" id="calc">Calculate</button><div class="result" id="result" aria-live="polite">Enter your values and calculate.</div><div class="faq"><h2>How to use</h2><p>Enter the values above and press Calculate. The result updates instantly in your browser.</p></div></section>`;
document.getElementById("calc").onclick=calc;
}
function n(id){return parseFloat(document.getElementById(id).value)}
function money(x){return Number.isFinite(x)?x.toLocaleString(undefined,{maximumFractionDigits:2}):"—"}
function route(){
let key=location.hash.slice(1)||"home";
if(key==="home"){home();return}
switch(key){
case"percentage-calculator":page("Percentage Calculator","Calculate common percentage problems.",input("a","Percentage (%)")+input("b","Number"),()=>{let a=n("a"),b=n("b");document.getElementById("result").innerHTML=Number.isFinite(a)&&Number.isFinite(b)?`${money(a)}% of ${money(b)} = ${money(a*b/100)}`:"Please enter valid numbers."});break;
case"discount-calculator":page("Discount Calculator","Calculate the final price and how much you save.",input("price","Original price")+input("discount","Discount (%)"),()=>{let p=n("price"),d=n("discount"),s=p*d/100;document.getElementById("result").innerHTML=Number.isFinite(p)&&Number.isFinite(d)?`Final price: ${money(p-s)}<div class="muted">You save ${money(s)}.</div>`:"Please enter valid numbers."});break;
case"tip-calculator":page("Tip Calculator","Calculate tip, total and split the bill.",input("bill","Bill amount")+input("tip","Tip (%)")+input("people","People","number","1"),()=>{let b=n("bill"),t=n("tip"),p=n("people"),x=b*t/100;document.getElementById("result").innerHTML=Number.isFinite(b)&&Number.isFinite(t)&&p>0?`Total: ${money(b+x)}<div class="muted">Tip: ${money(x)} · Per person: ${money((b+x)/p)}</div>`:"Please enter valid values."});break;
case"age-calculator":page("Age Calculator","Find your age from your date of birth.",input("dob","Date of birth","date"),()=>{let v=document.getElementById("dob").value;if(!v){document.getElementById("result").textContent="Choose your birth date.";return}let d=new Date(v+"T00:00:00Z"),now=new Date(),y=now.getUTCFullYear()-d.getUTCFullYear(),m=now.getUTCMonth()-d.getUTCMonth(),day=now.getUTCDate()-d.getUTCDate();if(day<0){m--;day+=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),0)).getUTCDate()}if(m<0){y--;m+=12}document.getElementById("result").innerHTML=`You are ${y} years, ${m} months and ${day} days old.`});break;
case"bmi-calculator":page("BMI Calculator","A general screening calculation based on height and weight.",input("height","Height (cm)")+input("weight","Weight (kg)"),()=>{let h=n("height")/100,w=n("weight"),b=w/(h*h);let cat=b<18.5?"Underweight":b<25?"Healthy range":b<30?"Overweight":b>=30?"Obesity":"—";document.getElementById("result").innerHTML=Number.isFinite(b)&&h>0&&w>0?`BMI: ${b.toFixed(1)}<div class="muted">${cat}. BMI is a general screening measure, not a diagnosis.</div>`:"Please enter valid values."});break;
case"date-difference":page("Date Difference","Find the number of days between two dates.",input("start","Start date","date")+input("end","End date","date"),()=>{let a=new Date(document.getElementById("start").value+"T00:00:00Z"),b=new Date(document.getElementById("end").value+"T00:00:00Z"),d=Math.round((b-a)/86400000);document.getElementById("result").textContent=Number.isFinite(d)?`${Math.abs(d).toLocaleString()} days${d<0?" (end date is earlier)":""}.`:"Choose both dates."});break;
case"time-calculator":page("Time Calculator","Calculate the duration between two times.",input("start","Start time","time")+input("end","End time","time"),()=>{let a=document.getElementById("start").value,b=document.getElementById("end").value;if(!a||!b){document.getElementById("result").textContent="Choose both times.";return}let [ah,am]=a.split(":").map(Number),[bh,bm]=b.split(":").map(Number),d=bh*60+bm-(ah*60+am);if(d<0)d+=1440;document.getElementById("result").textContent=`${Math.floor(d/60)} hours ${d%60} minutes.`});break;
case"vat-calculator":page("VAT Calculator","Add VAT to a net amount or remove VAT from a gross amount.",input("amount","Amount")+input("vat","VAT (%)"),()=>{let a=n("amount"),v=n("vat"),vat=a*v/100;document.getElementById("result").innerHTML=Number.isFinite(a)&&Number.isFinite(v)?`With VAT: ${money(a+vat)}<div class="muted">VAT amount: ${money(vat)}</div>`:"Please enter valid numbers."});break;
case"salary-calculator":page("Salary Calculator","Simple estimate from gross salary and a deduction percentage.",input("gross","Gross salary")+input("deductions","Deductions (%)"),()=>{let g=n("gross"),d=n("deductions"),x=g*(1-d/100);document.getElementById("result").innerHTML=Number.isFinite(g)&&Number.isFinite(d)?`Estimated net: ${money(x)}<div class="muted">Actual payroll deductions vary by country.</div>`:"Please enter valid numbers."});break;
case"fraction-calculator":page("Fraction Calculator","Perform basic operations with fractions.",input("a1","First numerator")+input("a2","First denominator")+input("b1","Second numerator")+input("b2","Second denominator"),()=>{let a=n("a1"),ad=n("a2"),b=n("b1"),bd=n("b2"),op="+",num=a*bd+b*ad,den=ad*bd;let g=(x,y)=>{x=Math.abs(x);y=Math.abs(y);while(y){[x,y]=[y,x%y]}return x||1};if(!ad||!bd){document.getElementById("result").textContent="Denominators cannot be zero.";return}let gg=g(num,den);document.getElementById("result").textContent=`${num/gg}/${den/gg}`});break;
case"random-number-generator":page("Random Number Generator","Generate a random whole number between two values.",input("min","Minimum","number","1")+input("max","Maximum","number","1"),()=>{let a=Math.ceil(n("min")),b=Math.floor(n("max"));if(!Number.isFinite(a)||!Number.isFinite(b)||a>b){document.getElementById("result").textContent="Enter a valid range.";return}document.getElementById("result").textContent=String(Math.floor(Math.random()*(b-a+1))+a)});break;
case"unit-converter":page("Unit Converter","Convert common length, weight and temperature units.",`<div class="field"><label for="value">Value</label><input id="value" type="number"></div><div class="field"><label for="unit">Conversion</label><select id="unit"><option value="km-mi">Kilometers → Miles</option><option value="mi-km">Miles → Kilometers</option><option value="kg-lb">Kilograms → Pounds</option><option value="lb-kg">Pounds → Kilograms</option><option value="c-f">Celsius → Fahrenheit</option><option value="f-c">Fahrenheit → Celsius</option></select></div>`,()=>{let v=n("value"),u=document.getElementById("unit").value,r=u==="km-mi"?v*.621371:u==="mi-km"?v/0.621371:u==="kg-lb"?v*2.20462:u==="lb-kg"?v/2.20462:u==="c-f"?v*9/5+32:(v-32)*5/9;document.getElementById("result").textContent=Number.isFinite(r)?money(r):"Please enter a valid number."});break;
default:home();
}}
window.addEventListener("hashchange",route);route();
</script>
</body></html>
